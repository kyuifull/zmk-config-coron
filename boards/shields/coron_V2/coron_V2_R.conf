# Name shown to the host over BLE and USB (also BT_DEVICE_NAME / USB product).
CONFIG_ZMK_KEYBOARD_NAME="Coron"

CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y

CONFIG_SPI=y
CONFIG_INPUT=y

# PAW3222 optical sensor (2-wire SPI, CS tied to GND)
CONFIG_PAW3222=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Encoder scrolling queues a press/release pair per detent. The default of 64
# overflows on a fast spin, and a dropped release leaves &msc scrolling forever.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=256

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
